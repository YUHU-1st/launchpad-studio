name: Android remote APK

on:
  push:
    paths:
      - "android/**"
      - "VERSION"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "VERSION"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build and lint APK
        run: gradle -p android assembleDebug lintDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaunchpadStudio2-Matrix-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
