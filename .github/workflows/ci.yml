name: Windows core tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core test dependencies
        run: python -m pip install numpy soundfile sounddevice psutil
      - name: Run core tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q app.py core tests
