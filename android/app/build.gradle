plugins { id 'com.android.application' }

def releaseVersion = file('../../VERSION').text.trim()

android {
    namespace 'io.github.yuhu.launchpadstudio.remote'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.yuhu.launchpadstudio.remote'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName releaseVersion
    }
}
