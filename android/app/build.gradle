plugins {
    id "com.android.application"
}

android {
    namespace "io.github.yuhu.launchpadstudio.remote"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.yuhu.launchpadstudio.remote"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
